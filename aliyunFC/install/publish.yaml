Edition: 3.0.0
Type: Project
Name: cloakbrowser-serverless
Provider:
  - 阿里云
Version: 0.0.1
Description: 基于 ACR 自定义容器镜像快速创建 FC3 云函数(cloakbrowser stealth Chromium)
HomePage: https://cnb.cool/oilu/browser-manager
Tags:
  - 云函数
  - 自定义容器
  - 浏览器
  - 防检测
  - Serverless
Category: 基础云服务
Service:
  函数计算:
    Authorities:
      - AliyunFCFullAccess
  镜像服务:
    Authorities:
      - AliyunContainerRegistryReadOnlyAccess
Organization: lutong
Effective: Private
Parameters:
  type: object
  additionalProperties: false
  required:
    - region
    - functionName
    - imageUrl
  properties:
    region:
      type: string
      title: 地域
      description: 函数计算开服地域
      default: cn-hangzhou
      enum:
        - cn-beijing
        - cn-hangzhou
        - cn-shanghai
        - cn-shenzhen
    functionName:
      type: string
      title: 函数名称
      description: 创建的函数名称(唯一)
      default: cloakbrowser
      minLength: 1
    imageUrl:
      type: string
      title: 容器镜像地址
      description: ACR 上已有的 cloakbrowser 自定义容器镜像, 例如 crpi-xxx.cn-hangzhou.personal.cr.aliyuncs.com/oilu/cloakbrowser-serverless:0.1.0
      pattern: "^([a-zA-Z0-9._-]+(/[a-zA-Z0-9._-]+)+)(:[a-zA-Z0-9._-]+)?$"
    memorySize:
      type: integer
      title: 内存(MB)
      description: 函数内存规格, 浏览器运行建议 >= 2048
      default: 2048
      minimum: 512
    cpu:
      type: number
      title: CPU(vCPU)
      description: 0.05 vCPU 的倍数
      default: 1
    timeout:
      type: integer
      title: 超时时间(秒)
      description: 函数运行超时上限
      default: 600
      minimum: 3