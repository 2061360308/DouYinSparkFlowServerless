# =============================================================================
# FC3 应用描述文件: 通过 s deploy 快速创建/更新 FC 云函数
#
# 使用前提:
#   1. 本地安装 Serverless Devs(s install s)
#   2. 已配置密钥: s config add --AccessKeyID xxx --AccessKeySecret xxx -a default
#   3. ACR 中已有 cloakbrowser 自定义容器镜像 (imageUrl)
#
# 常用命令:
#   s deploy            # 创建/更新函数并附带触发器
#   s remove            # 删除函数
#     {{ }} 变量由 s init 时按 publish.yaml Parameters 交互填入,
#     也可手动替换后直接 s deploy。
# =============================================================================
edition: 3.0.0
name: cloakbrowser-serverless
access: default

resources:
  cloakbrowserServerless:
    component: fc3
    props:
      region: "{{ region }}"
      functionName: "{{ functionName }}"
      description: CloakBrowser stealth Chromium(remote debugging) + websockets 代理
      runtime: custom-container
      memorySize: "{{ memorySize }}"
      cpu: "{{ cpu }}"
      diskSize: 10240
      timeout: "{{ timeout }}"
      instanceConcurrency: 1
      internetAccess: true
      logConfig: auto
      customContainerConfig:
        image: "{{ imageUrl }}"
        port: 9000
        command: []
        entrypoint: []
        healthCheckConfig:
          httpGetUrl: /healthz
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 1
          successThreshold: 1
          failureThreshold: 3
      triggers:
        - triggerName: httpTrigger
          triggerType: http
          qualifier: LATEST
          triggerConfig:
            authType: function
            disableURLInternet: false
            methods:
              - GET
              - POST
              - PUT
              - DELETE
              - HEAD