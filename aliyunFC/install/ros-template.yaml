ROSTemplateFormatVersion: '2015-09-01'
Description:
  zh-cn: >-
    cloakbrowser-serverless 全量部署模板: RAM 服务角色 + FC3 自定义容器函数(开启 HEADER_FIELD
    会话亲和, 允许默认网卡访问公网) + Web 触发器 + EventBridge 事件总线(计划任务定时调度)。默认地域 cn-hangzhou。
  en: >
    Full cloakbrowser-serverless stack: RAM service role + FC3 custom-container function
    (HEADER_FIELD session affinity, internet access enabled) + HTTP trigger.

Parameters:
  # ===========================================================================
  # 全局参数
  # ===========================================================================
  NamePrefix:
    Type: String
    Default: DouyinSpark
    Label:
      zh-cn: 资源名称前缀
      en: Resource name prefix
    Description:
      zh-cn: "资源名称前缀。注意: 角色名/函数名需在账号内全局唯一, 若已存在请修改。"
      en: Prefix for resource names. Role/function names must be account-unique.

  # ===========================================================================
  # 函数参数
  # ===========================================================================
  FunctionName:
    Type: String
    Default: DYSparkCloakBrowser
    Label:
      zh-cn: 函数名称
      en: Function name
  ImageUrl:
    Type: String
    Default: crpi-yagm0mg4gyj902wq.cn-hangzhou.personal.cr.aliyuncs.com/oilu/cloakbrowser-serverless:latest
    Label:
      zh-cn: 容器镜像地址
      en: Container image URL
    Description:
      zh-cn: ACR 个人版镜像, 需与部署地域一致(默认 cn-hangzhou)。
      en: ACR personal edition image; must be in the same region as the stack.
  Cpu:
    Type: Number
    Default: 1
    MinValue: 0.05
    MaxValue: 16
    Label:
      zh-cn: CPU (vCPU)
      en: CPU (vCPU)
  MemorySize:
    Type: Number
    Default: 1536
    MinValue: 128
    Label:
      zh-cn: 内存 (MB)
      en: Memory (MB)
  DiskSize:
    Type: Number
    Default: 10240
    AllowedValues:
      - 512
      - 10240
    Label:
      zh-cn: 磁盘 (MB)
      en: Disk (MB)
  FunctionTimeout:
    Type: Number
    Default: 600
    MinValue: 1
    MaxValue: 86400
    Label:
      zh-cn: 容器最大执行时间 (秒)
      en: Function timeout (s)
  ContainerPort:
    Type: Number
    Default: 9000
    MinValue: 1
    MaxValue: 65535
    Label:
      zh-cn: 容器监听端口
      en: Container port
  TriggerName:
    Type: String
    Default: webTrigger
    Label:
      zh-cn: Web 触发器名称
      en: Trigger name
  TriggerAuthType:
    Type: String
    Default: anonymous
    AllowedValues:
      - anonymous
      - function
    Label:
      zh-cn: 触发器鉴权方式
      en: Trigger auth type
    Description:
      zh-cn: anonymous 无需鉴权 / function 需函数签名。
      en: anonymous / function.

  # ===========================================================================
  # 会话亲和参数 (HEADER_FIELD, 请求头键名 sessionid)
  # ===========================================================================
  SessionAffinityHeaderFieldName:
    Type: String
    Default: sessionid
    Label:
      zh-cn: 会话亲和请求头名
      en: Affinity header name
    Description:
      zh-cn: 5-40 字符, 字母开头, 不能以 x-fc- 前缀开头。
      en: 5-40 chars, start with a letter, not prefixed with x-fc-.
  SessionTTLSeconds:
    Type: Number
    Default: 600
    MinValue: 1
    MaxValue: 21600
    Label:
      zh-cn: 会话最长生命周期 (秒)
      en: Session TTL (s)
  SessionIdleTimeoutSeconds:
    Type: Number
    Default: 30
    MinValue: 0
    MaxValue: 21600
    Label:
      zh-cn: 会话空闲等待时间 (秒)
      en: Session idle timeout (s)
  SessionConcurrencyPerInstance:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 200
    Label:
      zh-cn: 单实例最大 Session 数
      en: Session concurrency per instance
  DisableSessionIdReuse:
    Type: Boolean
    Default: false
    Label:
      zh-cn: Session 过期后拒绝复用
      en: Disable session id reuse

  # ===========================================================================
  # 健康检查
  # ===========================================================================
  HealthCheckUrl:
    Type: String
    Default: /
    Label:
      zh-cn: 健康检查探测路径
      en: Health check path
  HealthInitialDelaySeconds:
    Type: Number
    Default: 5
    MinValue: 0
    MaxValue: 120
    Label:
      zh-cn: 启动后延迟探测 (秒)
      en: Initial delay (s)
  HealthPeriodSeconds:
    Type: Number
    Default: 5
    MinValue: 1
    MaxValue: 120
    Label:
      zh-cn: 健康检查周期 (秒)
      en: Check period (s)
  HealthTimeoutSeconds:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 3
    Label:
      zh-cn: 健康检查超时 (秒)
      en: Check timeout (s)

  # ===========================================================================
  # 事件总线 (EventBridge, 供计划任务定时调度 → FC 使用)
  # ===========================================================================
  EventBusName:
    Type: String
    Default: DouyinSpark-bus
    Label:
      zh-cn: 事件总线名称
      en: Event bus name
    Description:
      zh-cn: EventBridge 自定义事件总线名称, 计划任务定时调度规则挂载于此 (2-127 字符, 字母开头)。
      en: Custom EventBridge bus name for scheduled task rules (2-127 chars).

  # ===========================================================================
  # 续火任务执行器 (FC3 自定义容器) + 定时调度规则
  # ===========================================================================
  TaskImageUrl:
    Type: String
    Default: crpi-yagm0mg4gyj902wq.cn-hangzhou.personal.cr.aliyuncs.com/oilu/douyin_spark_runner:latest
    Label:
      zh-cn: 任务执行器镜像地址
      en: Task runner image URL
    Description:
      zh-cn: 续火任务执行器容器镜像 (aliyunFC/taskrunner 构建), 需与部署地域一致。
      en: Task runner container image (built from aliyunFC/taskrunner).
  TaskFunctionName:
    Type: String
    Default: DYSparkTaskRunner
    Label:
      zh-cn: 任务执行器函数名
      en: Task runner function name
  TaskTriggerName:
    Type: String
    Default: taskTrigger
    Label:
      zh-cn: 任务执行器触发器名
      en: Task runner trigger name
  TaskCpu:
    Type: Number
    Default: 0.5
    MinValue: 0.05
    MaxValue: 16
    Label:
      zh-cn: 任务执行器 CPU (vCPU)
      en: Task runner CPU (vCPU)
  TaskMemorySize:
    Type: Number
    Default: 512
    MinValue: 128
    Label:
      zh-cn: 任务执行器内存 (MB)
      en: Task runner memory (MB)
  TaskFunctionTimeout:
    Type: Number
    Default: 300
    MinValue: 1
    MaxValue: 86400
    Label:
      zh-cn: 任务执行器超时 (秒)
      en: Task runner timeout (s)
  TaskContainerPort:
    Type: Number
    Default: 9000
    MinValue: 1
    MaxValue: 65535
    Label:
      zh-cn: 任务执行器容器端口
      en: Task runner container port
  ApiBaseUrl:
    Type: String
    Default: ""
    Label:
      zh-cn: FastAPI 基址
      en: FastAPI base URL
    Description:
      zh-cn: 任务函数访问的控制台后端基址, 如 https://<app>.vercel.app (部署时填写)。
      en: Console backend base URL the task function calls (fill at deploy).
  ServiceToken:
    Type: String
    Default: ""
    NoEcho: true
    Label:
      zh-cn: 服务令牌
      en: Service token
    Description:
      zh-cn: 任务函数访问 /api/internal/* 的机器身份令牌, 需与后端 SPARK_SERVICE_TOKEN 一致。
      en: Machine token for /api/internal/*; must match backend SPARK_SERVICE_TOKEN.
  BearerToken:
    Type: String
    Default: ""
    NoEcho: true
    Label:
      zh-cn: Bearer 令牌
      en: Bearer token
    Description:
      zh-cn: EventBridge 经 Connection 以 Authorization Bearer 头调用任务触发器时携带的令牌, 任务容器据此校验 (务必设一个随机值)。
      en: Bearer token EventBridge sends via Connection; the task container verifies it.
  ApiDestinationName:
    Type: String
    Default: DouyinSpark-fc-dest
    Label:
      zh-cn: API 端点名称
      en: API destination name
  ConnectionName:
    Type: String
    Default: DouyinSpark-fc-conn
    Label:
      zh-cn: 连接配置名称
      en: Connection name
  RuleName:
    Type: String
    Default: DouyinSpark-schedule
    Label:
      zh-cn: 定时调度规则名
      en: Schedule rule name

Resources:
  # ===========================================================================
  # RAM 角色: FC 服务角色 (fc.aliyuncs.com 承担) + 系统策略
  # ===========================================================================
  Role:
    Type: ALIYUN::RAM::Role
    Properties:
      RoleName:
        Fn::Join:
          - '-'
          - - Ref: NamePrefix
            - fc3-role
      Description: FC service role for cloakbrowser
      AssumeRolePolicyDocument:
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              Service:
                - fc.aliyuncs.com
        Version: '1'

  LogPolicy:
    Type: ALIYUN::RAM::AttachPolicyToRole
    Properties:
      PolicyName: AliyunLogFullAccess
      PolicyType: System
      RoleName:
        Ref: Role

  # ===========================================================================
  # FC3 函数 (自定义容器) + Web(HTTP) 触发器
  # ===========================================================================
  Function:
    Type: ALIYUN::FC3::Function
    DependsOn:
      - LogPolicy
    Properties:
      FunctionName:
        Ref: FunctionName
      Description: CloakBrowser stealth Chromium remote debugging + websockets proxy
      Runtime: custom-container
      Handler: index.handler
      Cpu:
        Ref: Cpu
      MemorySize:
        Ref: MemorySize
      DiskSize:
        Ref: DiskSize
      Timeout:
        Ref: FunctionTimeout
      InstanceConcurrency: 200
      InternetAccess: true
      Role:
        Fn::GetAtt:
          - Role
          - Arn
      SessionAffinity: HEADER_FIELD
      SessionAffinityConfig:
        affinityHeaderFieldName:
          Ref: SessionAffinityHeaderFieldName
        sessionIdleTimeoutInSeconds:
          Ref: SessionIdleTimeoutSeconds
        sessionTTLInSeconds:
          Ref: SessionTTLSeconds
        sessionConcurrencyPerInstance:
          Ref: SessionConcurrencyPerInstance
        disableSessionIdReuse:
          Ref: DisableSessionIdReuse
      CustomContainerConfig:
        Image:
          Ref: ImageUrl
        Port:
          Ref: ContainerPort
        HealthCheckConfig:
          HttpGetUrl:
            Ref: HealthCheckUrl
          InitialDelaySeconds:
            Ref: HealthInitialDelaySeconds
          PeriodSeconds:
            Ref: HealthPeriodSeconds
          TimeoutSeconds:
            Ref: HealthTimeoutSeconds
          SuccessThreshold: 1
          FailureThreshold: 3
      LogConfig:
        LogBeginRule: None
      Tags:
        - Key: Service
          Value:
            Ref: NamePrefix

  WebTrigger:
    Type: ALIYUN::FC3::Trigger
    DependsOn:
      - Function
    Properties:
      FunctionName:
        Ref: FunctionName
      TriggerName:
        Ref: TriggerName
      TriggerType: http
      Qualifier: LATEST
      Description: cloakbrowser web trigger
      TriggerConfig:
        authType:
          Ref: TriggerAuthType
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - HEAD

  # ===========================================================================
  # 事件总线 (EventBridge): 计划任务(target_env=fc)定时调度链路
  # 说明: ROS 仅支持 ALIYUN::EventBridge::Rule, 不含 EventBus/Connection/
  #   ApiDestination, 因此事件总线 + Connection + ApiDestination + Rule 由控制台
  #   在部署完成后经 OpenAPI 幂等预置(见 aliyunFC/install/eventbridge_resources.py)。
  #   此处仅保留参数声明与 EventBusName 输出, 供安装状态回写使用。
  # ===========================================================================

  # ===========================================================================
  # 续火任务执行器函数 (FC3 自定义容器) + HTTP 触发器
  # ===========================================================================
  TaskFunction:
    Type: ALIYUN::FC3::Function
    DependsOn:
      - LogPolicy
    Properties:
      FunctionName:
        Ref: TaskFunctionName
      Description: 续火计划任务执行器(connect_over_cdp 驱动远程浏览器, 经内部 API 取数)
      Runtime: custom-container
      Handler: index.handler
      Cpu:
        Ref: TaskCpu
      MemorySize:
        Ref: TaskMemorySize
      DiskSize: 512
      Timeout:
        Ref: TaskFunctionTimeout
      InstanceConcurrency: 1
      InternetAccess: true
      Role:
        Fn::GetAtt:
          - Role
          - Arn
      CustomContainerConfig:
        Image:
          Ref: TaskImageUrl
        Port:
          Ref: TaskContainerPort
        HealthCheckConfig:
          HttpGetUrl: /
          InitialDelaySeconds: 5
          PeriodSeconds: 5
          TimeoutSeconds: 3
          SuccessThreshold: 1
          FailureThreshold: 3
      EnvironmentVariables:
        SPARK_API_BASE_URL:
          Ref: ApiBaseUrl
        SPARK_SERVICE_TOKEN:
          Ref: ServiceToken
      LogConfig:
        LogBeginRule: None
      Tags:
        - Key: Service
          Value:
            Ref: NamePrefix

  TaskTrigger:
    Type: ALIYUN::FC3::Trigger
    DependsOn:
      - TaskFunction
    Properties:
      FunctionName:
        Ref: TaskFunctionName
      TriggerName:
        Ref: TaskTriggerName
      TriggerType: http
      Qualifier: LATEST
      Description: 续火任务执行器 HTTP 触发器(Bearer 鉴权, EventBridge 经 Connection 调用)
      TriggerConfig:
        authType: function
        authConfig:
          Fn::Join:
            - ''
            - - '{"tokens":[{"enable":true,"tokenData":"'
              - Ref: BearerToken
              - '","tokenName":"eb-bearer-token"}]}'
        methods:
          - POST

  # ===========================================================================
  # 事件投递(Connection/ApiDestination/Rule): 由控制台经 OpenAPI 幂等预置,
  # 见 aliyunFC/install/eventbridge_resources.py::ensure_infrastructure
  # ===========================================================================

Outputs:
  TriggerUrlInternet:
    Description: Web 触发器公网访问地址
    Value:
      Fn::GetAtt:
        - WebTrigger
        - UrlInternet
  TriggerUrlIntranet:
    Description: Web 触发器内网访问地址
    Value:
      Fn::GetAtt:
        - WebTrigger
        - UrlIntranet
  FunctionName:
    Description: 函数名称
    Value:
      Fn::GetAtt:
        - Function
        - FunctionName
  EventBusName:
    Description: EventBridge 事件总线名称 (计划任务定时调度用, 控制台经 OpenAPI 预置)
    Value:
      Ref: EventBusName
  TaskFunctionName:
    Description: 续火任务执行器函数名称
    Value:
      Fn::GetAtt:
        - TaskFunction
        - FunctionName
  TaskTriggerUrlInternet:
    Description: 续火任务执行器 HTTP 触发器公网地址 (EventBridge 规则投递目标)
    Value:
      Fn::GetAtt:
        - TaskTrigger
        - UrlInternet
