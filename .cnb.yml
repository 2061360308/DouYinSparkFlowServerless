# ==============================================================================
# CNB 流水线: cloakbrowser 镜像构建并推送 ACR
#
# 触发方式:
#   1. push 到 main 且改动 aliyunFC/cloakbrowser/**  -> 自动构建推送
#   2. 页面手动触发(代码仓库流水线页面按钮): 强制构建并推送 ACR
#      (配 .cnb/web_trigger.yml, 忽略 ifModify, 总是执行)
# ==============================================================================
# 公共构建/推送/校验逻辑: push 与 web_trigger 两条流水线复用
x-acr-build: &acr-build
  services:
    - docker
  imports:
    - https://cnb.cool/oilu/key/-/blob/main/secrets.yml
  env:
    ACR_REGISTRY: crpi-yagm0mg4gyj902wq.cn-hangzhou.personal.cr.aliyuncs.com
    ACR_IMAGE: crpi-yagm0mg4gyj902wq.cn-hangzhou.personal.cr.aliyuncs.com/oilu/cloakbrowser-serverless
  stages:
    - name: 登录阿里云 ACR
      script: echo "$ACR_PASSWORD" | docker login --username="$ACR_USERNAME" --password-stdin "$ACR_REGISTRY"
    - name: 构建并推送镜像
      script: |
        cd aliyunFC/cloakbrowser
        IMAGE_VERSION="$(cat VERSION)"
        # 构建机 Docker 29.x 的 docker build 透传 buildx。两点必备:
        #   1. --provenance=false --sbom=false: 禁止 buildx 默认附加 SLSA
        #      attestation(会生成 unknown/unknown 平台的 OCI index, 0.1.0/latest
        #      曾因此异常);
        #   2. --output type=image,push=true,oci-mediatypes=false:
        #      强制导出 docker schema2 manifest(而非 buildx 默认的 OCI),
        #      ACR 个人版控制台只认 docker schema2, 否则层/大小显示空白。
        docker buildx build --provenance=false --sbom=false \
          --build-arg IMAGE_VERSION="$IMAGE_VERSION" \
          --output type=image,name="$ACR_IMAGE:$IMAGE_VERSION",push=true,oci-mediatypes=false \
          --output type=image,name="$ACR_IMAGE:latest",push=true,oci-mediatypes=false \
          .
    - name: 校验 ACR 上 tag 为单平台 manifest(防 attestation 复发)
      script: |
        set -euo pipefail
        cd aliyunFC/cloakbrowser
        IMAGE_VERSION="$(cat VERSION)"
        for tag in "$IMAGE_VERSION" latest; do
          echo "==> 校验 ${ACR_IMAGE}:$tag"
          if ! out="$(docker manifest inspect "$ACR_IMAGE:$tag" 2>/dev/null)"; then
            echo "!! 无法读取 ${ACR_IMAGE}:$tag 的 manifest(push 可能未生效)" >&2
            exit 1
          fi
          if printf '%s' "$out" | grep -q '"manifests"'; then
            if printf '%s' "$out" | grep -qE '"os"[[:space:]]*:[[:space:]]*"unknown"'; then
              echo "!! ${ACR_IMAGE}:$tag 的 index 含 unknown 平台项(buildx provenance attestation), 请检查是否有其它流程覆盖" >&2
              exit 1
            fi
            echo "==> OK: 多平台 index, 无 attestation"
          else
            echo "==> OK: 单平台 manifest"
          fi
        done

# 续火任务执行器(taskrunner)镜像: 上下文=仓库根(需 COPY core/), 复用同一 ACR 登录逻辑
x-taskrunner-build: &taskrunner-build
  services:
    - docker
  imports:
    - https://cnb.cool/oilu/key/-/blob/main/secrets.yml
  env:
    ACR_REGISTRY: crpi-yagm0mg4gyj902wq.cn-hangzhou.personal.cr.aliyuncs.com
    ACR_IMAGE: crpi-yagm0mg4gyj902wq.cn-hangzhou.personal.cr.aliyuncs.com/oilu/douyin_spark_runner
  stages:
    - name: 登录阿里云 ACR
      script: echo "$ACR_PASSWORD" | docker login --username="$ACR_USERNAME" --password-stdin "$ACR_REGISTRY"
    - name: 构建并推送 taskrunner 镜像(上下文=仓库根)
      script: |
        IMAGE_VERSION="$(cat aliyunFC/taskrunner/VERSION)"
        docker buildx build --provenance=false --sbom=false \
          -f aliyunFC/taskrunner/Dockerfile \
          --build-arg IMAGE_VERSION="$IMAGE_VERSION" \
          --output type=image,name="$ACR_IMAGE:$IMAGE_VERSION",push=true,oci-mediatypes=false \
          --output type=image,name="$ACR_IMAGE:latest",push=true,oci-mediatypes=false \
          .
    - name: 校验 ACR 上 tag 为单平台 manifest
      script: |
        set -euo pipefail
        IMAGE_VERSION="$(cat aliyunFC/taskrunner/VERSION)"
        for tag in "$IMAGE_VERSION" latest; do
          out="$(docker manifest inspect "$ACR_IMAGE:$tag" 2>/dev/null)" || { echo "!! 无法读取 ${ACR_IMAGE}:$tag" >&2; exit 1; }
          if printf '%s' "$out" | grep -q '"manifests"' && printf '%s' "$out" | grep -qE '"os"[[:space:]]*:[[:space:]]*"unknown"'; then
            echo "!! ${ACR_IMAGE}:$tag 含 unknown 平台项(attestation)" >&2; exit 1;
          fi
        done

main:
  push:
    cloakbrowser:
      name: cloakbrowser 镜像构建并推送 ACR
      <<: *acr-build
      ifModify:
        - aliyunFC/cloakbrowser/**
    taskrunner:
      name: taskrunner 镜像构建并推送 ACR
      <<: *taskrunner-build
      ifModify:
        - aliyunFC/taskrunner/**
        - core/**

$:
  web_trigger_build_push:
    cloakbrowser:
      name: "手动触发: 强制构建并推送 ACR"
      <<: *acr-build
    taskrunner:
      name: "手动触发: 强制构建并推送 taskrunner"
      <<: *taskrunner-build